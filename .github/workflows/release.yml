# Builds the tagged commit and publishes a GitHub release with the mod jar.
# Trigger by pushing a tag like v0.7.10-26.2 (tag on the branch you want released).

name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: collect release jar
        run: |
          mkdir release
          cp build/libs/*.jar release/
          rm -f release/*-sources.jar release/*-javadoc.jar
      - name: extract changelog
        run: |
          # tag v0.11.0-26.1.2 -> section "## 0.11.0" from CHANGELOG.md
          VERSION=$(echo "${GITHUB_REF_NAME}" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          awk -v ver="$VERSION" '/^## /{p = ($2 == ver)} p && !/^## /' CHANGELOG.md > changelog-section.md
          if [ ! -s changelog-section.md ]; then echo "See CHANGELOG.md" > changelog-section.md; fi
          cat changelog-section.md
      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          body_path: changelog-section.md
          prerelease: true
      # Auto-publishes the same jar to Modrinth when the repo has the secrets set:
      #   MODRINTH_TOKEN - a Modrinth personal access token (user settings -> PATs,
      #                    needs the "create versions" scope)
      #   MODRINTH_ID    - the project id/slug (create the project on Modrinth first)
      # Without the secrets this step just skips, so releases keep working either way.
      # mc-publish can't resolve "26.3-snapshot-3" as a game version even when told
      # explicitly (fails with "at least one game version should be specified"), so
      # this branch uploads straight through Modrinth's API instead.
      - name: publish to modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        env:
          MODRINTH_ID: ${{ secrets.MODRINTH_ID }}
        run: |
          JAR=$(ls release/*.jar | grep -v -e sources -e javadoc | head -n1)
          FILENAME=$(basename "$JAR")
          GAME_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          VERSION_NUMBER="${GITHUB_REF_NAME#v}"
          jq -n \
            --arg name "$VERSION_NUMBER" \
            --arg version_number "$VERSION_NUMBER" \
            --rawfile changelog changelog-section.md \
            --arg game_version "$GAME_VERSION" \
            --arg project_id "$MODRINTH_ID" \
            --arg filename "$FILENAME" \
            '{
              name: $name,
              version_number: $version_number,
              changelog: $changelog,
              dependencies: [
                {project_id: "9s6osm5g", version_id: null, file_name: null, dependency_type: "required"},
                {project_id: "P7dR8mSH", version_id: null, file_name: null, dependency_type: "required"}
              ],
              game_versions: [$game_version],
              version_type: "alpha",
              loaders: ["fabric"],
              featured: true,
              status: "listed",
              requested_status: "listed",
              project_id: $project_id,
              file_parts: [$filename]
            }' > modrinth-data.json
          curl -sf -H "Authorization: $MODRINTH_TOKEN" \
            -F "data=<modrinth-data.json;type=application/json" \
            -F "$FILENAME=@$JAR;type=application/java-archive" \
            "https://api.modrinth.com/v2/version"
